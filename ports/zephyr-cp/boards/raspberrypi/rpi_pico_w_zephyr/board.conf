CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y

CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LEGACY_CRYPTO=n
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="circuitpython"

CONFIG_MBEDTLS=y
# Allocate PSA key material with malloc() instead of 38 KB of static slots.
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=n
# Keep the AES tables in flash instead of copying 8 KB of them into RAM.
CONFIG_MBEDTLS_AES_ROM_TABLES=y

CONFIG_TEST_RANDOM_GENERATOR=y

# No Zephyr UART console by default (see board.overlay); a CONSOLE=1 build turns
# it back on in console.conf.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
