# Keep allocation statistics for Zephyr's malloc arena. This is the only way
# to find out how much of the arena is free: port_heap_get_largest_free_size()
# needs that number so the VM heap can grow into the arena.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_USE_DT_CODE_PARTITION=y

# The MCUboot integration signs zephyr.hex into zephyr.signed.hex; boards whose
# SoC does not select BUILD_OUTPUT_HEX (e.g. STM32 does) otherwise only emit a
# .bin, and the Makefile's firmware.hex merge then has nothing to sign.
CONFIG_BUILD_OUTPUT_HEX=y

CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_FLASH_MAP_LABELS=y
CONFIG_MAIN_STACK_SIZE=24288

# The system workqueue is used by BT settings delayed store (NVS flash writes
# during bond key save). RRAM flash drivers on nRF54L need more than the
# default 1024 bytes to avoid stack overflow.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

CONFIG_THREAD_STACK_INFO=y
CONFIG_ARCH_POSIX_UPDATE_STACK_INFO=y
CONFIG_STACK_SENTINEL=n
CONFIG_DEBUG_THREAD_INFO=n
CONFIG_EXCEPTION_STACK_TRACE=n

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_MSC_STACK_SIZE=1536
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1
CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=4096

CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_ASSERT=n
CONFIG_LOG_BLOCK_IN_THREAD=y

CONFIG_EVENTS=y

# Enable the RTC driver layer so boards with a status-okay `rtc` devicetree
# alias (e.g. native_sim's rtc-emul, STM32, RP2040, SmartBond) get a working
# rtc module via common-hal/rtc. Boards without the alias only pay for the
# tiny RTC core (syscall table + rtc_utils).
CONFIG_RTC=y

# Enable the watchdog driver layer so boards with a status-okay `watchdog0`
# devicetree alias (the same selection Zephyr's watchdog sample uses, e.g.
# native_sim's counter-based emulation, Nordic WDT, RP2040, STM32) get a
# working watchdog module via common-hal/watchdog. Boards without the alias
# only pay for the tiny watchdog core (syscall table).
CONFIG_WATCHDOG=y

CONFIG_SERIAL=y

# Fail quickly on hung I2C devices (probe/scan also uses this timeout)
CONFIG_I2C_TRANSFER_TIMEOUT_MS=50

# Zephyr's Nordic SoC defconfig sets UART_USE_RUNTIME_CONFIGURE default n
# (soc/nordic/Kconfig.defconfig) for footprint. Without it the UARTE driver
# does not register api.configure and uart_configure() returns -ENOSYS
# unconditionally, which makes busio.UART fail with "Unsupported UART
# configuration" for every config. Runtime configure is required for the
# iobroker-routed UARTs to get their baudrate/parity/stop bits applied.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=2
CONFIG_FRAME_POINTER=n

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="circuitpython"

CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y

CONFIG_FPU=y

CONFIG_MBEDTLS=y

# Override Kconfig default not taking effect. The BLE file-transfer workflow
# packs up to BLEIO_PACKET_BUFFER_MAX_PACKET_SIZE (512) bytes per notification,
# so the L2CAP/ATT MTU must accommodate a 512-byte payload plus the 3-byte
# ATT header (opcode + handle). Without this the default with SMP is only 65,
# and notifications larger than the negotiated MTU fail with
# "No ATT channel for MTU".
CONFIG_BT_L2CAP_TX_MTU=515
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_LONG_WQ_STACK_SIZE=3072
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# Real-world certificate chains use SHA-384/512 signatures (e.g. Sectigo
# "R"-series CAs) and ECDSA signatures. The PSA wants for those, and for the
# curve/cipher selection matching ports/espressif/sdkconfig, are gated on
# ZCP_MBEDTLS_TLS in internal-modules/circuitpython-kconfig/Kconfig. They
# cannot be unconditional here: BT boards without the TLS stack would compile
# the corresponding unused tf-psa-crypto code, which trips -Werror and the
# driver-only-builds config checks.

# Zephyr defaults the TLS input buffer to 1500 bytes, but real-world TLS
# peer certificates arrive in single records larger than that (e.g. ~4 KB
# from adafruit.com). mbedtls then fails fetch_input() with
# MBEDTLS_ERR_SSL_BAD_INPUT_DATA, which in mbedtls 4.x numerically collides
# with MBEDTLS_ERR_PK_BAD_INPUT_DATA, so CircuitPython surfaces it as a
# misleading "invalid key" ValueError in the middle of the handshake.
# Use mbedtls-style defaults matching ports/espressif/sdkconfig and
# lib/mbedtls_config/mbedtls_config.h: 16384 in, 4096 out.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

# Settings storage backend for BT bond keys
# SECTOR_COUNT is set high — the init code caps it to what fits in the storage
# partition: min(sector_count, partition_size / sector_size)
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=256

# Zephyr's host reserves a connection object for a connectable advertiser, and
# the controller sizes its RX node pool from this too. With the default of 1,
# user code cannot connect as a central or start a timed scan while the BLE
# workflow advertises. 5 matches nordic. About 2.9 KB of RAM per connection.
CONFIG_BT_MAX_CONN=5

# Number of stored bonds. The default of 1 means bonding to a second peer
# evicts the BLE workflow's bond (BT_KEYS_OVERWRITE_OLDEST). 3 matches
# espressif's NimBLE default; nordic keeps dozens.
CONFIG_BT_MAX_PAIRED=3
