title: MicroPython Related Pins using pure integers for identification

description: |
        Generate a pin list associated with a GPIO device using an integer format,
        this produces sets similar to the RP2 or ESP32 port's Pin identifiers.

compatible: "micropython,related-pins-integer-generator"

include: ["micropython,related-pins-common.yaml"]

properties:
  gpio-out-ranges:
    type: array
    required: true
    description: |
      Integer Pin ranges on micropython side. It must not overlap other generator's ranges.
      The format is identical to 'gpio-reserved-ranges' from a gpio-controller.
      The count of pairs must match gpio-in-ranges'.

  gpio-in-ranges:
    type: array
    default: [0, 32]
    description: |
      Integer Pin ranges on zephyr size.
      The format is identical to 'gpio-reserved-ranges' from a gpio-controller.
      The count of pairs must match gpio-out-ranges'.
      The default covers the whole possible range of a GPIO controller.

examples:
  - |
    gpio0_related {
      compatible = "micropython,related-pins-integer-generator";
      gpio-device = <&gpio0>;
      gpio-out-ranges = <0 32>;
    };
