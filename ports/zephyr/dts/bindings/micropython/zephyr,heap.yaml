title: Zephyr Heap

description: |
    Used to define a Zephyr heap area.

compatible: "zephyr,heap"

include: [base.yaml]

properties:
  size:
    type: int
    required: true
    description: |
      Size of the heap

  memory-region:
    type: phandle
    required: true
    description: |
      Memory region to place the heap in
