# Configure serial console over USB CDC ACM.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y

# Disable networking.
CONFIG_NETWORKING=n

# Hardware features.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_SPI=y

# MicroPython config.
CONFIG_MICROPY_HEAP_SIZE=458752
CONFIG_MICROPY_CONFIG_ROM_LEVEL_FULL_FEATURES=y

# Dynamic Pinctrl
CONFIG_MICROPY_DYNAMIC_PINCTRL=y
CONFIG_PINCTRL_DYNAMIC=y
CONFIG_PINCTRL=y
CONFIG_MICROPY_DYNAMIC_PINCTRL_HEADER="dt-bindings/pinctrl/rpi-pico-rp2350a-pinctrl.h"
CONFIG_MICROPY_DYNAMIC_PINCTRL_REGEX="[ 	][A-Za-z0-9_]+_P[0-9]+[ 	]"
CONFIG_MICROPY_DYNAMIC_PINCTRL_BUILDER_FILE="dynamic_pinctrl/rpi_pico.c"
CONFIG_MICROPY_DYNAMIC_PINCTRL_GENERATE_PINMUX=y
CONFIG_MICROPY_DYNAMIC_PINCTRL_SUPPORT_ILLEGAL=y

# Bugfix
CONFIG_MICROPY_CONFIGFILE="rpi_pico/rp2350.h"
