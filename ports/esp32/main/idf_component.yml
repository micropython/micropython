dependencies:
  # holding off on updating mdns as newer versions have higher
  # resource usage
  espressif/mdns: "~1.3.0"
  espressif/tinyusb:
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4, esp32s31]"
    # The previous temporary workaround fork
    # (micropython/tinyusb-espressif, cherrypick/dwc2_zlp_fix) does not
    # support esp32s31, and a manifest cannot select different sources per
    # target, so use the registry component which carries the DWC2 OUT EP
    # ZLP fix (hathach/tinyusb#3293) as well.
    version: "0.19.0~3"
  # esp_hosted / esp_wifi_remote: 0.15.x / 2.7.x don't build against IDF v6
  # (the wifi_remote sources for v6.1 are only in 1.6.0+). Pick the version
  # per IDF version so the 5.x lockfiles keep the existing pins.
  espressif/esp_hosted:
    matches:
      - if: "target == esp32p4 && idf_version < 6.0"
        version: "2.7.0"
      - if: "target == esp32p4 && idf_version >= 6.0"
        version: "2.12.8"
  espressif/esp_wifi_remote:
    matches:
      - if: "target == esp32p4 && idf_version < 6.0"
        version: "0.15.2"
      - if: "target == esp32p4 && idf_version >= 6.0"
        version: "1.6.0"
  espressif/lan867x:
    version: "~1.0.0"
    rules:
      - if: "target == esp32"
  # Ethernet PHY drivers that moved out of ESP-IDF core in v6.0. Every
  # registry version of these requires idf >= 6.0, so gate on idf_version to
  # keep the 5.x lockfiles resolving without them.
  espressif/ip101:
    version: "~1.0.0"
    rules:
      - if: "idf_version >= 6.0 && target in [esp32, esp32p4]"
  espressif/lan87xx:
    version: "~1.0.0"
    rules:
      - if: "idf_version >= 6.0 && target in [esp32, esp32p4]"
  espressif/rtl8201:
    version: "~1.0.0"
    rules:
      - if: "idf_version >= 6.0 && target in [esp32, esp32p4]"
  espressif/dp83848:
    version: "~1.0.0"
    rules:
      - if: "idf_version >= 6.0 && target in [esp32, esp32p4]"
  espressif/ksz80xx:
    version: "~1.0.0"
    rules:
      - if: "idf_version >= 6.0 && target in [esp32, esp32p4]"
  idf:
    version: ">=5.3.0"
