name: samd port

on:
  push:
    paths: &paths
      - ".github/workflows/*.yml"
      - "tools/*.*"
      - "py/**"
      - "extmod/**"
      - "shared/**"
      - "lib/**"
      - "drivers/**"
      - "ports/samd/**"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: tools/ci.sh samd_setup
      - name: Build
        run: tools/ci.sh samd_build
