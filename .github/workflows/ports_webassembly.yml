name: webassembly port

on:
  push:
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - 'tools/**'
      - 'py/**'
      - 'extmod/**'
      - 'shared/**'
      - 'lib/**'
      - 'ports/webassembly/**'
      - 'tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # The browser variant needs a node with JSPI, which is on by default
    # from Node 25.  Pin the major so Node upgrades are deliberate.  This
    # step must come before webassembly_setup, because emsdk only adds
    # its own node to PATH when none is already there.
    - uses: actions/setup-node@v7
      with:
        node-version: 25
    - name: Install packages
      run: tools/ci.sh webassembly_setup
    - name: Build
      run: tools/ci.sh webassembly_build
    - name: Run tests
      run: tools/ci.sh webassembly_run_tests
    - name: Print failures
      if: failure()
      run: tests/run-tests.py --print-failures
